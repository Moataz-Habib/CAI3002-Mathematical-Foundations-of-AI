<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Moataz Habib</title>
<style>
:root{--a1:#2b3f63;--on:#fff;--bg:#faf9f6;--fg:#1c1c1e;--mut:#6b6b70;--card:#fff;--line:#e4e2dc;--tint:#f3f1ec;--b1:#9a4a3a;--grid:#00000008;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--serif:Georgia,"Iowan Old Style","Times New Roman",serif}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--a1:#a9bbd8;--on:#14161a;--bg:#14161a;--fg:#e8e6e1;--mut:#9a9aa0;--card:#1a1d22;--line:#2a2e35;--tint:#1f2227;--b1:#d9a08f;--grid:#ffffff09}}
:root[data-theme="dark"]{--a1:#a9bbd8;--on:#14161a;--bg:#14161a;--fg:#e8e6e1;--mut:#9a9aa0;--card:#1a1d22;--line:#2a2e35;--tint:#1f2227;--b1:#d9a08f;--grid:#ffffff09}
*{box-sizing:border-box}
body{margin:0;background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:32px 32px;color:var(--fg);font:15px/1.65 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:hidden}
.page{max-width:1040px;margin:0 auto;padding:0 22px 70px;display:grid;grid-template-columns:250px minmax(0,1fr);gap:40px;align-items:start}
.side{position:sticky;top:calc(24px + env(safe-area-inset-top,0px));margin-top:40px;background:var(--card);border:1px solid var(--line);border-radius:4px;text-align:center;overflow:hidden}
.cover{display:flex;justify-content:flex-end;padding:10px 12px 0}
#tg{font:inherit;font-size:12px;padding:3px 10px;border-radius:3px;border:1px solid var(--line);background:none;color:var(--mut);cursor:pointer;transition:.2s}
#tg:hover{color:var(--a1);border-color:var(--a1)}
.sb{padding:0 20px 22px}
.ring{width:108px;height:108px;margin:6px auto 14px}
.ring img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:1px solid var(--line);display:block}
.nm{font:600 21px/1.25 var(--serif);margin:0}.role{color:var(--mut);font-size:13.5px;margin:3px 0 12px;font-style:italic;font-family:var(--serif)}
.ab{color:var(--mut);font-size:13.5px;text-align:left;margin:0 0 8px}
.sb h4{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin:18px 0 8px;padding-top:14px;border-top:1px solid var(--line);text-align:left;font-weight:600}
.edu{list-style:none;margin:0;padding:0;text-align:left;font-size:13px}
.edu li{padding:0 0 10px}
.edu small{display:block;color:var(--mut)}
.room{display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;margin:14px 0 0;padding-top:14px;border-top:1px solid var(--line);color:var(--mut)}.room svg{color:var(--mut)}
.soc{margin-top:12px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.soc a{font-size:13px;border:1px solid var(--line);border-radius:3px;padding:4px 12px;color:var(--fg);text-decoration:none;transition:.2s}
.soc a:hover{color:var(--a1);border-color:var(--a1)}
main{padding-top:56px;min-width:0}
h1{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin:0}
.course{margin-top:14px;padding-top:14px;border-top:2px solid var(--fg)}
.lab{display:inline-block;font-size:12px;font-weight:600;letter-spacing:.1em;color:var(--a1)}
.course h2{font:600 30px/1.2 var(--serif);letter-spacing:-.01em;margin:6px 0 8px}
.note{color:var(--mut);margin:0 0 4px;font-size:14px;min-height:22px;max-width:62ch}
.tabs{display:flex;gap:4px 18px;flex-wrap:wrap;margin:14px 0 14px;border-bottom:1px solid var(--line)}
.tab{font:inherit;font-size:13px;padding:6px 0 8px;margin-bottom:-1px;border:0;border-bottom:2px solid transparent;background:none;color:var(--mut);cursor:pointer;transition:.2s}
.tab:hover{color:var(--fg)}.tab.on{color:var(--a1);border-bottom-color:var(--a1);font-weight:600}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:4px}
table{border-collapse:collapse;width:100%;min-width:600px;font-size:13px}
th{text-align:left;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);padding:11px 14px;border-bottom:1px solid var(--line)}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top}tr:last-child td{border-bottom:0}
tbody tr:not(.gh):hover{background:var(--tint)}
.gh td{background:var(--tint);font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--a1);padding:7px 14px}
.n{width:40px}.nb{color:var(--mut);font:13px var(--serif);font-variant-numeric:tabular-nums}
td b{font-family:var(--serif);font-size:14.5px;font-weight:600}
td small{display:block;color:var(--mut);font-size:12.5px;margin-top:2px}
th:nth-child(2){width:190px}.tp{color:var(--mut);font-size:12.5px;min-width:190px}
.mat{width:215px}.mat .meta{margin-top:4px;font-size:12px}
.btn{display:inline-block;font-size:11.5px;font-weight:500;padding:2px 10px;border-radius:3px;margin:0 4px 4px 0;text-decoration:none;color:var(--on);background:var(--a1);border:1px solid var(--a1);transition:.2s}
a.btn:hover{opacity:.85}.btn.o{background:none;color:var(--a1)}
.btn.off{background:none;color:var(--mut);border:1px dashed var(--line);cursor:default}.mat>span{display:block}
.ref{display:flex;align-items:center;gap:14px;margin-top:18px;padding:14px 16px;background:var(--card);border:1px solid var(--line);border-radius:4px}
.bi{width:34px;height:34px;color:var(--mut);display:flex;align-items:center;justify-content:center;flex:none}
.ref .t{flex:1}.ref small{display:block;font-size:11px;letter-spacing:.09em;color:var(--mut)}.ref b{display:block;font:600 14.5px var(--serif)}.ref span{font-size:12.5px;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.rv{opacity:0;transform:translateY(10px);transition:opacity .5s ease,transform .5s ease}.rv.in{opacity:1;transform:none}
footer{text-align:center;color:var(--mut);font-size:13px;padding:10px 0 30px}
@media(max-width:880px){.page{grid-template-columns:minmax(0,1fr);gap:0}.side{position:static;margin-top:26px}main{padding-top:30px}}
.ref{align-items:center;gap:18px;margin:16px 0 4px;padding:14px 18px}.ref .cv{flex:none;width:76px;box-shadow:0 3px 10px rgba(0,0,0,.25),inset 0 0 0 1px #0002;border-radius:2px;overflow:hidden;line-height:0}.ref .cv svg,.ref .cv img{width:100%;height:auto;display:block}.ref .t{display:flex;flex-direction:column;align-items:flex-start;gap:2px}.ref .t b{font-size:17px}.ref .t .btn{margin:8px 0 0}
@media(max-height:820px){.fig canvas{height:240px}}
@media(prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}}

.fig{margin:0 0 34px;background:var(--card);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.fig canvas{display:block;width:100%;height:300px}
.bar{position:relative;display:flex;justify-content:space-between;align-items:center;padding:4px 8px 4px 14px;border-bottom:1px solid var(--line);font:600 11.5px system-ui;letter-spacing:.05em;color:var(--mut)}
.bar button{font:inherit;font-size:15px;border:0;background:none;color:var(--mut);cursor:pointer;padding:2px 9px}.bar button:hover{color:var(--a1)}
#pg{position:absolute;left:0;bottom:-1px;height:2px;background:var(--b1);width:0}
.pl{display:block;margin-top:6px;font:inherit;font-size:11.5px;color:var(--b1);background:none;border:0;padding:0;cursor:pointer}.pl:hover{text-decoration:underline}

#dots{margin-right:8px}.bar #dots button{width:7px;height:7px;border-radius:50%;padding:0;margin:0 3px;border:1px solid var(--mut);font-size:0}.bar #dots button.on{background:var(--b1);border-color:var(--b1)}
.bar #tt{font:600 15px var(--serif);letter-spacing:0;color:var(--a1)}
.fig figcaption{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:8px 14px;border-top:1px solid var(--line);font:italic 13px var(--serif);color:var(--mut)}
.fig figcaption b{font-style:normal;color:var(--a1);font-weight:600}
.fig .d{font-style:normal;color:var(--b1);font-variant-numeric:tabular-nums}
.gl{display:inline-block;min-width:22px;margin-right:6px;font:italic 15px/1 var(--serif);letter-spacing:0;text-transform:none;color:var(--b1)}
a.btn:hover,.soc a:hover{border-color:var(--b1)}
.nb{color:var(--b1)}
</style>
</head>

const e=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
const C=CONFIG,root=document.documentElement;document.title=C.name;

const cache={};
const has=u=>cache[u]||(cache[u]=fetch(u,{method:"HEAD",cache:"no-cache"}).then(r=>r.ok).catch(()=>false));

const course=c=>{const gs=[...new Set(c.sections.map(s=>s[1]))];let g="",rows="";

SC.forEach((s,i)=>{const b=document.createElement("button");b.title=s.t;b.setAttribute("aria-label",s.t);b.onclick=()=>go(i);dots.appendChild(b)});
const size=()=>{const d=devicePixelRatio||1;W=cv.clientWidth;H=cv.clientHeight;cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0);frame(still?SC[idx].d*.85:el)};
$("pv").onclick=()=>go(idx-1);$("nx").onclick=()=>go(idx+1);pp.onclick=()=>{play=!play;pp.textContent=play?"❚❚":"▶"};if(still)pp.hidden=true;
addEventListener("resize",size);go(0);size();CAT.ranks.forEach(r=>r.im.onload=()=>{if(still)frame(SC[idx].d*.85)});CAT.o.onload=()=>{if(still)frame(SC[idx].d*.85)};
if(!still){const loop=now=>{const d=Math.min(100,now-last);last=now;if(run){if(play){el+=d;if(el>=SC[idx].d)go(idx+1)}frame(el)}requestAnimationFrame(loop)};requestAnimationFrame(loop)}
new IntersectionObserver(en=>{run=en[0].isIntersecting}).observe(cv);
})();
</script>
